      window.__app = {
        toggleStar: toggleStarMastered,
        goPage(p) { state.page = p; persistState(state, false); renderAll(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
        startGame,
        exitGame() { activeGameSession = null; renderGamesTab(); },
        prevQuestion, nextQuestion, skipQuestion, submitCurrentQuestion,
        speakHint: speakHintOnce,
        pickBlankSlot(bIdx) { if (activeGameSession && activeGameSession.mode === 1) { activeGameSession.questions[activeGameSession.index].activeBlank = bIdx; renderGamesTab(); } },
        chooseBlankOption(val) {
          if (!activeGameSession || activeGameSession.mode !== 1) return;
          const q = activeGameSession.questions[activeGameSession.index];
          if (q.submitted) return;
          const b = q.blanks[q.activeBlank];
          if (b) { b.picked = val; if (q.activeBlank + 1 < q.blanks.length) q.activeBlank++; renderGamesTab(); }
        },
        setActiveRow(rIdx) { if (activeGameSession && activeGameSession.mode === 2) { activeGameSession.questions[activeGameSession.index].activeRow = rIdx; renderGamesTab(); } },
        placeWordInRow(uid) {
          if (!activeGameSession || activeGameSession.mode !== 2) return;
          const q = activeGameSession.questions[activeGameSession.index];
          if (q.submitted) return;
          const idx = q.bank.findIndex((w) => w.uid === uid);
          if (idx !== -1) { const [wObj] = q.bank.splice(idx, 1); (q.rows[q.activeRow] || q.rows[0]).push(wObj); renderGamesTab(); }
        },
        returnWordToBank(rIdx, uid) {
          if (!activeGameSession || activeGameSession.mode !== 2) return;
          const q = activeGameSession.questions[activeGameSession.index];
          if (q.submitted) return;
          const row = q.rows[rIdx];
          if (!row) return;
          const idx = row.findIndex((w) => w.uid === uid);
          if (idx !== -1) { const [wObj] = row.splice(idx, 1); q.bank.push(wObj); renderGamesTab(); }
        },
        selectMcqOption(idx) { if (activeGameSession && activeGameSession.mode === 3 && !activeGameSession.questions[activeGameSession.index].submitted) { activeGameSession.questions[activeGameSession.index].selectedIdx = idx; renderGamesTab(); } },
        pickMatchLeft(slot) { if (activeGameSession && activeGameSession.mode === 4 && !activeGameSession.rounds[activeGameSession.index].submitted) { const r = activeGameSession.rounds[activeGameSession.index]; r.selectedLeft = r.selectedLeft === slot ? null : slot; renderGamesTab(); } },
        pickMatchRight(rightId) {
          if (!activeGameSession || activeGameSession.mode !== 4) return;
          const r = activeGameSession.rounds[activeGameSession.index];
          if (r.submitted || r.selectedLeft === null) return;
          Object.keys(r.pairs).forEach((k) => { if (r.pairs[k] === rightId) delete r.pairs[k]; });
          r.pairs[r.selectedLeft] = rightId; r.selectedLeft = null; renderGamesTab();
        },
        autoFillUnmastered20() {
          state.studyIds = shuffleArray(state.items.filter((x) => !state.masteredMap[x.id])).slice(0, 20).map((x) => x.id);
          persistState(state); renderSettingDetail('study20'); renderAll(); showToast('Đã lấy ngẫu nhiên 20 bài chưa thuộc!');
        },
        saveStudy20() {
          const ch = Array.from(document.querySelectorAll('.study20-cb:checked')).map((e) => Number(e.value));
          if (!ch.length) { showToast('Chọn ít nhất 1 bài!'); return; }
          state.studyIds = ch.slice(0, 20); persistState(state); renderAll(); showToast('Đã lưu Góc học tập!');
        },
        filterCrudList() {
          const q = (document.getElementById('crudSearchInput')?.value || '').trim().toLowerCase();
          const box = document.getElementById('crudSearchResults');
          if (!box) return;
          box.innerHTML = state.items.filter((it) => !q || it.text.toLowerCase().includes(q) || it.meaning.toLowerCase().includes(q)).slice(0, 20).map((it) => `
            <div class="picker-item" style="justify-content:space-between;">
              <span><b>#${it.id}</b> ${escapeHtml(it.text.replace(/\n+/g, ' / '))}</span>
              <span style="display:flex;gap:4px;">
                <button type="button" class="chip-btn" onclick="window.__app.beginEditCrud(${it.id})">Sửa</button>
                <button type="button" class="chip-btn" style="background:#fee2e2;color:#991b1b;" onclick="window.__app.deleteCrudItem(${it.id})">Xóa</button>
              </span>
            </div>
          `).join('');
        },
        beginEditCrud(id) { editTargetId = id; renderSettingDetail('crud'); },
        saveCrudItem() {
          const kind = document.getElementById('crudKind')?.value || 'Tục ngữ';
          const topic = document.getElementById('crudTopic')?.value || TOPICS[0];
          const text = (document.getElementById('crudText')?.value || '').trim();
          const meaning = (document.getElementById('crudMeaning')?.value || '').trim();
          if (!text) { showToast('Nhập nội dung câu!'); return; }
          if (editTargetId) {
            const idx = state.items.findIndex((x) => x.id === editTargetId);
            if (idx !== -1) state.items[idx] = { ...state.items[idx], kind, topic, text, meaning: meaning || 'Ý nghĩa dân gian.' };
            editTargetId = null;
          } else {
            const maxId = state.items.reduce((m, x) => Math.max(m, Number(x.id) || 0), 0);
            state.items.unshift({ id: maxId + 1, kind, topic, text, meaning: meaning || 'Ý nghĩa dân gian.' });
          }
          persistState(state); renderSettingDetail('crud'); renderAll(); showToast('Đã lưu bài!');
        },
        deleteCrudItem(id) {
          state.items = state.items.filter((x) => x.id !== id);
          state.studyIds = state.studyIds.filter((x) => x !== id);
          delete state.masteredMap[id];
          persistState(state); renderSettingDetail('crud'); renderAll(); showToast('Đã xóa bài.');
        },
        exportJsonFile() {
          const blob = new Blob([JSON.stringify({ items: state.items, studyIds: state.studyIds, masteredMap: state.masteredMap }, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = 'net-dep-tieng-viet.json';
          document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
          showToast('Đã tải file .JSON!');
        },
        handleImportJson(ev) {
          const file = ev.target.files && ev.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(reader.result);
              const incoming = Array.isArray(parsed) ? parsed : (parsed.items || []);
              let maxId = state.items.reduce((m, x) => Math.max(m, Number(x.id) || 0), 0);
              const conflicts = [];
              const uniqueNew = [];
              incoming.forEach((raw) => {
                if (!raw || typeof raw.text !== 'string' || !raw.text.trim()) return;
                let bestMatch = null, bestScore = 0;
                state.items.forEach((ex) => { const s = computeSimilarity(ex.text, raw.text); if (s > bestScore) { bestScore = s; bestMatch = ex; } });
                const cand = { id: ++maxId, kind: raw.kind || 'Tục ngữ', topic: TOPICS.includes(raw.topic) ? raw.topic : inferTopic(raw), text: raw.text.trim(), meaning: (raw.meaning || 'Ý nghĩa dân gian.').trim() };
                if (bestScore > 0.9 && bestMatch) conflicts.push({ candidate: cand, existing: bestMatch, sim: Math.round(bestScore * 100) });
                else if (bestScore < 0.75) uniqueNew.push(cand);
              });
              state.items.push(...uniqueNew); persistState(state); renderAll();
              const box = document.getElementById('importConflictBox');
              if (conflicts.length && box) {
                window.__app._pendingConflicts = conflicts;
                box.innerHTML = `<div class="feedback-box err"><b>Trùng &gt; 90%:</b>${conflicts.map((c, i) => `<div style="margin-top:6px;">${escapeHtml(c.candidate.text)} <button type="button" class="chip-btn active" onclick="window.__app.resolveConflict(${i},'add')">Thêm mới</button> <button type="button" class="chip-btn" onclick="window.__app.resolveConflict(${i},'overwrite')">Ghi đè</button></div>`).join('')}</div>`;
              } else showToast(`Đã nạp ${uniqueNew.length} bài mới!`);
            } catch (e) { showToast('File .JSON không hợp lệ.'); }
          };
          reader.readAsText(file, 'utf-8');
        },
        resolveConflict(idx, action) {
          const list = window.__app._pendingConflicts || [];
          const entry = list[idx];
          if (!entry) return;
          if (action === 'add') state.items.push(entry.candidate);
          else { const i = state.items.findIndex((x) => x.id === entry.existing.id); if (i !== -1) state.items[i] = { ...state.items[i], ...entry.candidate, id: entry.existing.id }; }
          list.splice(idx, 1); persistState(state); renderAll(); renderSettingDetail('backup');
        },
        reclassifyAllTopics() { state.items = state.items.map((it) => ({ ...it, topic: inferTopic(it) })); persistState(state); renderAll(); showToast('Đã đặt lại chủ đề!'); },
        restoreBase376() {
          const restored = BASE_376_ITEMS.map((it) => ({ id: it.id, kind: it.kind, text: it.text.trim(), meaning: it.meaning.trim(), topic: inferTopic(it) }));
          state.items = restored; state.studyIds = restored.slice(0, 20).map((x) => x.id); state.page = 1;
          persistState(state); renderAll(); showToast('Đã kéo lại 376 bài gốc!');
        }
      };

      function initFilterOptions() {
        document.getElementById('topicSelect').innerHTML = '<option value="">-- Tất cả chủ đề --</option>' + TOPICS.map((t) => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
        document.getElementById('letterSelect').innerHTML = '<option value="">-- Tất cả chữ cái đầu --</option>' + VIET_ALPHABET.map((l) => `<option value="${l}">${l}</option>`).join('');
      }

      function renderAll() {
        evaluateSpacedReviewCycles(Date.now());
        const showToolbar = state.activeTab === 'all' || state.activeTab === 'study' || state.activeTab === 'mastered';
        document.getElementById('searchFilterSection').style.display = showToolbar ? 'block' : 'none';
        document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === state.activeTab));
        const sortBtn = document.getElementById('sortOrderBtn');
        sortBtn.textContent = state.sortOrder === 'asc' ? 'A-Z' : (state.sortOrder === 'desc' ? 'Z-A' : '⇅');
        sortBtn.classList.toggle('active', state.sortOrder !== 'default');
        if (state.activeTab === 'games') renderGamesTab();
        else renderListTab(state.activeTab);
      }

      function bindEvents() {
        document.querySelectorAll('.tab-btn').forEach((b) => b.addEventListener('click', () => { state.activeTab = b.dataset.tab; state.page = 1; activeGameSession = null; persistState(state, false); renderAll(); }));
        document.getElementById('searchInput').addEventListener('input', (e) => { state.search = e.target.value; state.page = 1; renderAll(); });
        document.getElementById('toggleFilterBtn').addEventListener('click', () => { const p = document.getElementById('filterPanel'); const n = !p.classList.contains('open'); p.classList.toggle('open', n); document.getElementById('toggleFilterBtn').classList.toggle('active', n); });
        document.getElementById('modeTopicBtn').addEventListener('click', () => { state.filterMode = 'topic'; state.filterLetter = ''; document.getElementById('modeTopicBtn').classList.add('active'); document.getElementById('modeLetterBtn').classList.remove('active'); document.getElementById('topicFilterBox').style.display = 'block'; document.getElementById('letterFilterBox').style.display = 'none'; state.page = 1; renderAll(); });
        document.getElementById('modeLetterBtn').addEventListener('click', () => { state.filterMode = 'letter'; state.filterTopic = ''; document.getElementById('modeLetterBtn').classList.add('active'); document.getElementById('modeTopicBtn').classList.remove('active'); document.getElementById('topicFilterBox').style.display = 'none'; document.getElementById('letterFilterBox').style.display = 'block'; state.page = 1; renderAll(); });
        document.getElementById('topicSelect').addEventListener('change', (e) => { state.filterTopic = e.target.value; state.page = 1; renderAll(); });
        document.getElementById('letterSelect').addEventListener('change', (e) => { state.filterLetter = e.target.value; state.page = 1; renderAll(); });
        document.getElementById('sortOrderBtn').addEventListener('click', () => { state.sortOrder = state.sortOrder === 'default' ? 'asc' : (state.sortOrder === 'asc' ? 'desc' : 'default'); state.page = 1; renderAll(); });
        document.getElementById('openSettingsBtn').addEventListener('click', openSettingsModal);
        document.getElementById('closeSettingsBtn').addEventListener('click', closeSettingsModal);
        document.getElementById('settingsModal').addEventListener('click', (e) => { if (e.target.id === 'settingsModal') closeSettingsModal(); });
        document.querySelectorAll('.setting-row-btn').forEach((b) => b.addEventListener('click', () => renderSettingDetail(b.dataset.setting)));
        window.addEventListener('beforeunload', () => persistState(state, true));
      }

      initFilterOptions();
      bindEvents();
      renderAll();
    })();
  </script>
</body>
</html>
